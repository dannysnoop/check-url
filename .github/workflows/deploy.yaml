name: Deploy to AWS

on:
  push:
    branches:
      - main  # Chạy khi có commit vào branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Hoặc phiên bản Node.js bạn đang sử dụng

      - name: Install dependencies
        run: |
          cd lambda
          npm install  # Cài đặt dependencies cho Lambda function

      - name: Zip Lambda function
        run: |
          cd lambda
          zip -r ../lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Thay theo region của bạn

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name my-lambda-function \
            --zip-file fileb://lambda.zip

      - name: Sync S3
        run: |
          aws s3 sync ./s3-assets s3://danny-deptrai11 --delete  # Đồng bộ dữ liệu lên S3
